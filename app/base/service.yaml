apiVersion: v1
kind: Service
metadata:
  name: progressive-delivery-stable
  labels:
    app: progressive-delivery
spec:
  selector:
    app: progressive-delivery
  ports:
    - name: http
      port: 80
      targetPort: 8080
  type: ClusterIP
