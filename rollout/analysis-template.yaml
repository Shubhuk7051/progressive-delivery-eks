apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: success-rate-and-error-rate
  namespace: progressive-delivery
spec:
  args:
    - name: canary-hash
  metrics:
    - name: error-rate
      interval: 30s
      count: 5
      successCondition: result[0] <= 0.1
      failureLimit: 2
      provider:
        prometheus:
          address: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
          query: |
            sum(rate(http_requests_total{status=~"5..", pod_template_hash="{{args.canary-hash}}"}[1m]))
            /
            sum(rate(http_requests_total{pod_template_hash="{{args.canary-hash}}"}[1m]))

    - name: success-rate
      interval: 30s
      count: 5
      successCondition: result[0] >= 0.9
      failureLimit: 2
      provider:
        prometheus:
          address: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
          query: |
            sum(rate(http_requests_total{status=~"2..", pod_template_hash="{{args.canary-hash}}"}[1m]))
            /
            sum(rate(http_requests_total{pod_template_hash="{{args.canary-hash}}"}[1m]))